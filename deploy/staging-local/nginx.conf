server {
  listen 80;
  server_name localhost;
  return 308 https://localhost:8443$request_uri;
}
server {
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /etc/nginx/stage8/local.crt;
  ssl_certificate_key /etc/nginx/stage8/local.key;
  root /usr/share/nginx/html;
  client_max_body_size 110m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src blob:; frame-src blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location ~ /\. { deny all; }
  location ~ ^/(api|sanctum)(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass backend:9000;
    fastcgi_read_timeout 90s;
  }
  location ~ ^/(login|forgot-password|reset-password)$ {
    if ($request_method ~ ^(GET|HEAD)$) { rewrite ^ /index.html last; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass backend:9000;
  }
  location ~ ^/(logout|password|up)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass backend:9000;
  }
  location ~ \.php(?:/|$) { return 404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
